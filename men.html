<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men's Luxury Tailoring | Vogue Avenue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="announcement-bar">Worldwide Shipping on All Luxury Orders</div>

    <header class="main-header">
        <div class="logo"><a href="index.html">Vogue Avenue</a></div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="women.html">Women</a>
            <a href="men.html" class="active">Men</a>
            <a href="about.html">About Us</a>
            <a href="size-chart.html">Size Chart</a>
        </nav>
        <div class="header-actions">
            <button id="search-trigger-btn" class="cart-icon-btn">🔍</button>
            <button class="cart-icon-btn" id="cart-trigger">🛒 <span id="cart-count">0</span></button>
        </div>
    </header>

    <div id="search-overlay" class="search-overlay">
        <button class="search-close-btn" id="search-close-btn">&times;</button>
        <div class="search-container"><input type="text" id="search-input" placeholder="SEARCH..."></div>
    </div>

    <section class="category-hero" style="background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?q=80&w=1600') center/cover; padding: 80px 4%; text-align: center;">
        <h1 class="section-title" style="color: white; font-size: 36px; letter-spacing: 5px;">Men's Tailoring</h1>
    </section>

    <main class="container" style="padding: 60px 4%;">
        <div class="products-grid">
            </div>
    </main>

    <div id="cart-drawer" class="cart-drawer">
        <div class="cart-drawer-header"><h3>Your Shopping Bag</h3><button id="cart-close-btn" class="close-btn">&times;</button></div>
        <div id="cart-items-container" class="cart-items-container"><p class="empty-message">Your cart is empty.</p></div>
    </div>

    <div class="ai-chat-widget">
        <button class="chat-toggle-btn-floating" id="chat-toggle">💬 Vogue Avenue</button>
        <div class="chat-window hidden" id="chat-window">
            <div class="chat-header"><h4>Vogue Avenue</h4><button id="chat-close">&times;</button></div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Ask a question...">
                <button id="chat-send">Send</button>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-column"><h3>Vogue Avenue</h3><p>Elite high-luxury fashion brand storefront.</p></div>
        </div>
        <div class="footer-bottom"><p>&copy; 2026 Vogue Avenue Store. All Rights Reserved.</p></div>
    </footer>

    <script src="app.js"></script>
    <script src="men.js"></script>
</body>
</html>
