<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Suit Store</title>
    <!-- Tailwind CSS for modern, clean layout styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Snipcart CSS for the shopping cart styling -->
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.4.1/default/snipcart.css" />
    <style>
        /* Your custom brand color palette scheme overrides */
        :root {
            --brand-primary: #1e293b; /* Deep slate/navy for formal luxury */
            --brand-accent: #b45309;  /* Warm amber/gold accent for call-to-actions */
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">TAILORED & CO.</h1>
            <button class="snipcart-checkout flex items-center gap-2 bg-slate-900 text-white px-4 py-2 rounded shadow hover:bg-slate-800 transition">
                <span>🛒 Cart</span>
                <span class="snipcart-items-count bg-amber-600 text-xs px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </header>

    <!-- Main Suit Grid -->
    <main class="max-w-7xl mx-auto px-4 py-12">
        <h2 class="text-3xl font-light tracking-wide mb-8 text-center uppercase">The Suit Collection</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Product Card: Suit 1 -->
            <div class="bg-white border border-gray-100 rounded-lg shadow-sm overflow-hidden group">
                <div class="relative overflow-hidden bg-gray-100 aspect-[3/4]">
                    <!-- Image of the suit goes here -->
                    <img src="https://images.unsplash.com/photo-1594938298603-c8148c4dae35?auto=format&fit=crop&w=600&q=80" alt="Premium Slim Fit Navy Suit" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    <span class="absolute top-3 left-3 bg-slate-900 text-white text-xs px-2 py-1 tracking-wider uppercase font-medium">Formal</span>
                </div>
                
                <div class="p-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-1">Premium Slim Fit Navy Suit</h3>
                    <p class="text-xl font-semibold text-slate-800 mb-4">$349.99</p>
                    
                    <!-- Options Selection -->
                    <div class="space-y-3 mb-6">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Select Size</label>
                            <select id="size-suit1" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-slate-900">
                                <option>38R (Waist 32)</option>
                                <option>40R (Waist 34)</option>
                                <option>42R (Waist 36)</option>
                                <option>44R (Waist 38)</option>
                            </select>
                        </div>
                        <button onclick="toggleModal('size-modal')" class="text-xs text-amber-700 underline hover:text-amber-800 transition">View Measurements & Size Chart</button>
                    </div>

                    <!-- Buy Button connected directly to your backend transaction panel -->
                    <button class="snipcart-add-item w-full block text-center bg-slate-900 text-white font-medium py-3 rounded hover:bg-slate-800 transition shadow-sm"
                        data-item-id="navy-suit-001"
                        data-item-name="Premium Slim Fit Navy Suit"
                        data-item-price="349.99"
                        data-item-url="/"
                        data-item-image="https://images.unsplash.com/photo-1594938298603-c8148c4dae35?auto=format&fit=crop&w=600&q=80"
                        data-item-custom1-name="Size"
                        data-item-custom1-options="38R|40R|42R|44R"
                        data-item-custom1-value="38R">
                        Add to Cart
                    </button>
                </div>
            </div>
            <!-- Additional product cards can be copied and dropped here -->
        </div>
    </main>

    <!-- Size Chart Popup Modal -->
    <div id="size-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white max-w-lg w-full rounded-lg p-6 shadow-xl relative animate-fade-in">
            <button onclick="toggleModal('size-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            <h3 class="text-xl font-semibold mb-4">Suit Size Matrix Guide</h3>
            <table class="w-full border-collapse text-left text-sm text-gray-600">
                <thead>
                    <tr class="border-b border-gray-200 text-gray-900 bg-gray-50">
                        <th class="p-2">Suit Size</th>
                        <th class="p-2">Chest (in)</th>
                        <th class="p-2">Waist (in)</th>
                        <th class="p-2">Sleeve (in)</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr><td class="p-2 font-medium text-gray-900">38R</td><td class="p-2">38"</td><td class="p-2">32"</td><td class="p-2">34"</td></tr>
                    <tr><td class="p-2 font-medium text-gray-900">40R</td><td class="p-2">40"</td><td class="p-2">34"</td><td class="p-2">34.5"</td></tr>
                    <tr><td class="p-2 font-medium text-gray-900">42R</td><td class="p-2">42"</td><td class="p-2">36"</td><td class="p-2">35"</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- JavaScript logic to change custom item value before adding to cart -->
    <script>
        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.classList.toggle('hidden');
        }

        document.getElementById('size-suit1').addEventListener('change', function(e) {
            const btn = document.querySelector('.snipcart-add-item');
            btn.setAttribute('data-item-custom1-value', e.target.value);
        });
    </script>

    <!-- Secure Checkout Integration API Injection Script -->
    <script async src="https://cdn.snipcart.com/themes/v3.4.1/default/snipcart.js"></script>
    <div id="snipcart" data-api-key="YOUR_FREE_API_KEY_HERE" hidden></div>
</body>
</html>
